<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital KPI Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide { display: none !important; }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50/50 font-sans text-slate-900 pb-12">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <i data-lucide="activity" class="h-6 w-6 text-white"></i>
                    </div>
                    <h1 id="nav-title" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700 hidden sm:block">
                        Hospital Performance Dashboard
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="lang-toggle" onclick="toggleLanguage()" class="flex items-center space-x-2 px-3 py-2 rounded-md hover:bg-slate-100 transition-colors text-sm font-medium text-slate-600 border border-slate-200">
                        <i data-lucide="globe" class="h-4 w-4"></i>
                        <span id="lang-text">ខ្មែរ</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <!-- Notification Toast -->
        <div id="toast" class="hide fixed top-20 right-8 px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 z-50 toast-enter bg-green-500 text-white">
            <i id="toast-icon" data-lucide="check-circle" class="h-5 w-5"></i>
            <span id="toast-message" class="font-medium">Message</span>
        </div>

        <!-- Global Loading Overlay -->
        <div id="loading-overlay" class="flex items-center justify-center p-8 mb-8 bg-blue-50 text-blue-700 rounded-xl border border-blue-100">
            <i data-lucide="refresh-cw" class="animate-spin mr-3 h-6 w-6"></i>
            <span id="loading-text" class="font-semibold text-lg">Syncing with Google Sheets...</span>
        </div>

        <div id="controls-container" class="hide flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div class="flex p-1 space-x-1 bg-white rounded-xl shadow-sm border border-slate-200 w-full sm:w-auto">
                <button id="tab-OPD" onclick="switchTab('OPD')" class="flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all bg-blue-600 text-white shadow-sm">
                    OPD
                </button>
                <button id="tab-IPD" onclick="switchTab('IPD')" class="flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-50">
                    IPD
                </button>
            </div>

            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <!-- Edit Mode Actions (Hidden by default) -->
                <div id="edit-actions" class="hide flex items-center space-x-3 w-full">
                    <div class="hidden sm:flex items-center text-amber-600 text-sm font-medium mr-2 animate-pulse">
                        <i data-lucide="alert-circle" class="mr-1 h-4 w-4"></i>
                        <span id="edit-mode-text">Edit mode active</span>
                    </div>
                    <button onclick="cancelEdit()" class="flex-1 sm:flex-none flex items-center justify-center space-x-2 px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-medium shadow-sm">
                        <i data-lucide="x-circle" class="h-4 w-4"></i>
                        <span id="btn-cancel">Cancel</span>
                    </button>
                    <button id="btn-save-wrapper" onclick="saveChanges()" class="flex-1 sm:flex-none flex items-center justify-center space-x-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors font-medium shadow-sm">
                        <i data-lucide="save" id="save-icon" class="h-4 w-4"></i>
                        <span id="btn-save">Save Changes</span>
                    </button>
                </div>
                <!-- View Mode Actions -->
                <div id="view-actions" class="w-full">
                    <button onclick="startEdit()" class="w-full flex-1 sm:flex-none flex items-center justify-center space-x-2 px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-medium shadow-sm">
                        <i data-lucide="edit-3" class="h-4 w-4"></i>
                        <span id="btn-edit">Edit Data</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="metrics-container" class="hide mb-8">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                <i data-lucide="activity" class="mr-2 text-blue-500 h-5 w-5"></i>
                <span id="kpi-title">Key Performance Indicators</span> - <span id="kpi-tab-name">OPD</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 sm:gap-6">
                
                <!-- Total Card -->
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 shadow-lg text-white xl:col-span-2 relative overflow-hidden group">
                    <div class="absolute -right-12 -top-12 w-40 h-40 bg-white opacity-5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 bg-white/10 rounded-xl backdrop-blur-sm">
                            <i data-lucide="users" class="text-white h-6 w-6"></i>
                        </div>
                        <div class="bg-white/20 px-3 py-1 rounded-full backdrop-blur-md border border-white/10">
                           <span class="text-sm font-semibold text-white">100%</span>
                        </div>
                    </div>
                    <div class="relative z-10">
                        <h3 id="card-title-total" class="text-slate-300 text-sm font-medium mb-1">Total</h3>
                        <div id="val-total" class="text-4xl font-extrabold tracking-tight">0</div>
                    </div>
                </div>

                <!-- Rejected Card -->
                <div class="bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-red-100"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-3 rounded-xl bg-red-100 text-red-600"><i data-lucide="x-circle" class="h-6 w-6"></i></div>
                        <div class="flex items-center space-x-1 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 view-element">
                           <span id="pct-rejected" class="text-sm font-semibold text-slate-600">0%</span>
                        </div>
                    </div>
                    <h3 id="card-title-rejected" class="text-slate-500 text-sm font-medium mb-1">Rejected</h3>
                    <div id="val-rejected" class="text-3xl font-bold text-slate-800 view-element">0</div>
                    <input type="number" id="input-rejected" oninput="updateEditData('rejected')" class="hide w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                </div>

                <!-- Approved Card -->
                <div class="bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-green-100"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-3 rounded-xl bg-green-100 text-green-600"><i data-lucide="check-circle" class="h-6 w-6"></i></div>
                        <div class="flex items-center space-x-1 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 view-element">
                           <span id="pct-approved" class="text-sm font-semibold text-slate-600">0%</span>
                        </div>
                    </div>
                    <h3 id="card-title-approved" class="text-slate-500 text-sm font-medium mb-1">Approved</h3>
                    <div id="val-approved" class="text-3xl font-bold text-slate-800 view-element">0</div>
                    <input type="number" id="input-approved" oninput="updateEditData('approved')" class="hide w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                </div>

                <!-- Hospital Director Card -->
                <div class="bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-purple-100"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-3 rounded-xl bg-purple-100 text-purple-600"><i data-lucide="settings" class="h-6 w-6"></i></div>
                        <div class="flex items-center space-x-1 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 view-element">
                           <span id="pct-hospitalDirector" class="text-sm font-semibold text-slate-600">0%</span>
                        </div>
                    </div>
                    <h3 id="card-title-director" class="text-slate-500 text-sm font-medium mb-1 truncate">Director</h3>
                    <div id="val-hospitalDirector" class="text-3xl font-bold text-slate-800 view-element">0</div>
                    <input type="number" id="input-hospitalDirector" oninput="updateEditData('hospitalDirector')" class="hide w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                </div>

                <!-- On Checking Card -->
                <div class="bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-yellow-100"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-3 rounded-xl bg-yellow-100 text-yellow-600"><i data-lucide="clock" class="h-6 w-6"></i></div>
                        <div class="flex items-center space-x-1 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 view-element">
                           <span id="pct-onChecking" class="text-sm font-semibold text-slate-600">0%</span>
                        </div>
                    </div>
                    <h3 id="card-title-checking" class="text-slate-500 text-sm font-medium mb-1">Checking</h3>
                    <div id="val-onChecking" class="text-3xl font-bold text-slate-800 view-element">0</div>
                    <input type="number" id="input-onChecking" oninput="updateEditData('onChecking')" class="hide w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                </div>

                <!-- Returned Card -->
                <div class="bg-white rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-slate-200"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-3 rounded-xl bg-slate-200 text-slate-700"><i data-lucide="rotate-ccw" class="h-6 w-6"></i></div>
                        <div class="flex items-center space-x-1 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 view-element">
                           <span id="pct-returned" class="text-sm font-semibold text-slate-600">0%</span>
                        </div>
                    </div>
                    <h3 id="card-title-returned" class="text-slate-500 text-sm font-medium mb-1">Returned</h3>
                    <div id="val-returned" class="text-3xl font-bold text-slate-800 view-element">0</div>
                    <input type="number" id="input-returned" oninput="updateEditData('returned')" class="hide w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                </div>
            </div>
        </div>

        <div id="charts-container" class="hide grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <i data-lucide="pie-chart" class="mr-2 text-indigo-500 h-5 w-5"></i>
                    <span id="chart-title-dist">Status Distribution</span>
                </h3>
                <div class="h-[300px] w-full relative">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <i data-lucide="trending-up" class="mr-2 text-green-500 h-5 w-5"></i>
                    <span id="chart-title-trend">Current Distribution (Count)</span>
                </h3>
                <div class="h-[300px] w-full relative">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ⚠️
        const GOOGLE_WEB_APP_URL = "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE";

        // State Variables
        let currentLang = 'en';
        let activeTab = 'OPD';
        let isEditing = false;
        let isSaving = false;
        
        let hospitalData = {
            OPD: { total: 6518, rejected: 1725, approved: 2803, hospitalDirector: 256, onChecking: 1734, returned: 0 },
            IPD: { total: 4250, rejected: 850, approved: 2100, hospitalDirector: 150, onChecking: 1050, returned: 100 }
        };
        let editData = {};

        const chartColors = ['#ef4444', '#22c55e', '#a855f7', '#eab308', '#64748b'];
        let myPieChart = null;
        let myBarChart = null;

        // Translations Dictionary
        const translations = {
            en: {
                dashboardTitle: "Hospital Performance Dashboard",
                opd: "OPD (Outpatient)",
                ipd: "IPD (Inpatient)",
                total: "Total", rejected: "Rejected", approved: "Approved",
                hospitalDirector: "Hospital Director", onChecking: "On Checking", returned: "Returned",
                saveChanges: "Save Changes", editData: "Edit Data", cancel: "Cancel",
                statusDistribution: "Status Distribution", trendAnalysis: "Current Distribution (Count)",
                dataSavedSuccess: "Data saved securely!", dataLoadError: "Failed to load data.",
                editModeActive: "Edit mode active. Click Save when done.",
                kpiMetrics: "Key Performance Indicators", loading: "Syncing with Google Sheets..."
            },
            km: {
                dashboardTitle: "ផ្ទាំងគ្រប់គ្រងសូចនាករសមិទ្ធកម្មមន្ទីរពេទ្យ",
                opd: "OPD (ផ្នែកពិគ្រោះជំងឺក្រៅ)",
                ipd: "IPD (ផ្នែកសម្រាកព្យាបាល)",
                total: "សរុប", rejected: "បដិសេធ", approved: "អនុម័ត",
                hospitalDirector: "ប្រធានមន្ទីរពេទ្យ", onChecking: "កំពុងពិនិត្យ", returned: "បានបញ្ជូនត្រឡប់",
                saveChanges: "រក្សាទុកការផ្លាស់ប្តូរ", editData: "កែសម្រួលទិន្នន័យ", cancel: "បោះបង់",
                statusDistribution: "ការចែកចាយស្ថានភាព", trendAnalysis: "ទិន្នន័យបច្ចុប្បន្ន (ចំនួន)",
                dataSavedSuccess: "ទិន្នន័យត្រូវបានរក្សាទុកដោយជោគជ័យ!", dataLoadError: "បរាជ័យក្នុងការទាញយកទិន្នន័យ",
                editModeActive: "មុខងារកែសម្រួលកំពុងដំណើរការ។",
                kpiMetrics: "សូចនាករសមិទ្ធកម្មគន្លឹះ", loading: "កំពុងធ្វើសមកាលកម្មជាមួយ Google Sheets..."
            }
        };

        // Initialize App
        async function init() {
            lucide.createIcons();
            applyTranslations();
            
            if (GOOGLE_WEB_APP_URL === "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE") {
                showToast("Using local demo data. Add URL to connect to Google Sheets.", "error");
                hideLoading();
                renderUI();
                renderCharts();
            } else {
                await fetchGoogleSheetsData();
            }
        }

        // Fetch Data from Google Apps Script
        async function fetchGoogleSheetsData() {
            try {
                const response = await fetch(GOOGLE_WEB_APP_URL);
                const fetchedData = await response.json();
                if (fetchedData && fetchedData.OPD && fetchedData.IPD) {
                    hospitalData = fetchedData;
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                showToast(translations[currentLang].dataLoadError, "error");
            } finally {
                hideLoading();
                renderUI();
                renderCharts();
            }
        }

        // UI Manipulation Functions
        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hide');
            document.getElementById('controls-container').classList.remove('hide');
            document.getElementById('metrics-container').classList.remove('hide');
            document.getElementById('charts-container').classList.remove('hide');
        }

        function switchTab(tab) {
            if (isEditing) {
                if (!confirm("You have unsaved changes. Discard them?")) return;
                cancelEdit();
            }
            activeTab = tab;
            
            // Update Tab Button Styles
            const opdBtn = document.getElementById('tab-OPD');
            const ipdBtn = document.getElementById('tab-IPD');
            
            if(tab === 'OPD') {
                opdBtn.className = "flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all bg-blue-600 text-white shadow-sm";
                ipdBtn.className = "flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-50";
            } else {
                ipdBtn.className = "flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm";
                opdBtn.className = "flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-50";
            }
            
            document.getElementById('kpi-tab-name').innerText = activeTab;
            renderUI();
            renderCharts();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'km' : 'en';
            document.getElementById('lang-text').innerText = currentLang === 'en' ? 'ខ្មែរ' : 'English';
            applyTranslations();
            renderUI();
            renderCharts(); // Re-render charts to update labels
        }

        function applyTranslations() {
            const t = translations[currentLang];
            document.getElementById('nav-title').innerText = t.dashboardTitle;
            document.getElementById('tab-OPD').innerText = t.opd;
            document.getElementById('tab-IPD').innerText = t.ipd;
            document.getElementById('edit-mode-text').innerText = t.editModeActive;
            document.getElementById('btn-cancel').innerText = t.cancel;
            document.getElementById('btn-save').innerText = t.saveChanges;
            document.getElementById('btn-edit').innerText = t.editData;
            document.getElementById('kpi-title').innerText = t.kpiMetrics;
            document.getElementById('card-title-total').innerText = t.total;
            document.getElementById('card-title-rejected').innerText = t.rejected;
            document.getElementById('card-title-approved').innerText = t.approved;
            document.getElementById('card-title-director').innerText = t.hospitalDirector;
            document.getElementById('card-title-checking').innerText = t.onChecking;
            document.getElementById('card-title-returned').innerText = t.returned;
            document.getElementById('chart-title-dist').innerText = t.statusDistribution;
            document.getElementById('chart-title-trend').innerText = t.trendAnalysis;
            document.getElementById('loading-text').innerText = t.loading;
        }

        function renderUI() {
            const dataToUse = isEditing ? editData : hospitalData[activeTab];
            const t = dataToUse.total || 1; // Prevent division by zero

            // Update Total
            document.getElementById('val-total').innerText = dataToUse.total.toLocaleString();

            // Helper to render metric card values
            const updateMetric = (key) => {
                document.getElementById(`val-${key}`).innerText = dataToUse[key].toLocaleString();
                document.getElementById(`pct-${key}`).innerText = Math.round((dataToUse[key] / t) * 100) + '%';
                if(isEditing) document.getElementById(`input-${key}`).value = dataToUse[key];
            };

            ['rejected', 'approved', 'hospitalDirector', 'onChecking', 'returned'].forEach(updateMetric);
        }

        function startEdit() {
            isEditing = true;
            editData = { ...hospitalData[activeTab] };
            
            document.getElementById('view-actions').classList.add('hide');
            document.getElementById('edit-actions').classList.remove('hide');
            
            document.querySelectorAll('.view-element').forEach(el => el.classList.add('hide'));
            document.querySelectorAll('.edit-element').forEach(el => el.classList.remove('hide'));
            
            renderUI();
        }

        function cancelEdit() {
            isEditing = false;
            
            document.getElementById('edit-actions').classList.add('hide');
            document.getElementById('view-actions').classList.remove('hide');
            
            document.querySelectorAll('.edit-element').forEach(el => el.classList.add('hide'));
            document.querySelectorAll('.view-element').forEach(el => el.classList.remove('hide'));
            
            renderUI();
        }

        function updateEditData(field) {
            const val = parseInt(document.getElementById(`input-${field}`).value) || 0;
            editData[field] = val;
            
            // Recalculate total
            editData.total = editData.rejected + editData.approved + editData.hospitalDirector + editData.onChecking + editData.returned;
            document.getElementById('val-total').innerText = editData.total.toLocaleString();
        }

        async function saveChanges() {
            if (GOOGLE_WEB_APP_URL === "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE") {
                hospitalData[activeTab] = { ...editData };
                cancelEdit();
                showToast("Saved locally (Demo Mode)", "success");
                renderCharts();
                return;
            }

            // UI update for saving
            isSaving = true;
            document.getElementById('save-icon').setAttribute('data-lucide', 'refresh-cw');
            document.getElementById('save-icon').classList.add('animate-spin');
            document.getElementById('btn-save').innerText = 'Saving...';
            lucide.createIcons();
            document.getElementById('btn-save-wrapper').disabled = true;

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ tab: activeTab, data: editData })
                });

                const result = await response.json();
                
                if (result.status === "success") {
                    hospitalData[activeTab] = { ...editData };
                    hospitalData[activeTab].total = result.newTotal; // use server calculated total to be safe
                    cancelEdit();
                    showToast(translations[currentLang].dataSavedSuccess, 'success');
                    renderCharts();
                } else {
                    throw new Error("Script error");
                }
            } catch (error) {
                console.error("Save error:", error);
                showToast("Failed to save to Sheets", 'error');
            } finally {
                isSaving = false;
                document.getElementById('save-icon').setAttribute('data-lucide', 'save');
                document.getElementById('save-icon').classList.remove('animate-spin');
                document.getElementById('btn-save').innerText = translations[currentLang].saveChanges;
                lucide.createIcons();
                document.getElementById('btn-save-wrapper').disabled = false;
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            
            if(type === 'success') {
                toast.className = 'fixed top-20 right-8 px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 z-50 toast-enter bg-green-500 text-white';
                document.getElementById('toast-icon').setAttribute('data-lucide', 'check-circle');
            } else {
                toast.className = 'fixed top-20 right-8 px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 z-50 toast-enter bg-red-500 text-white';
                document.getElementById('toast-icon').setAttribute('data-lucide', 'alert-circle');
            }
            
            lucide.createIcons();
            
            setTimeout(() => {
                toast.classList.add('hide');
            }, 4000);
        }

        function renderCharts() {
            const t = translations[currentLang];
            const data = hospitalData[activeTab];
            
            const labels = [t.rejected, t.approved, t.hospitalDirector, t.onChecking, t.returned];
            const chartValues = [data.rejected, data.approved, data.hospitalDirector, data.onChecking, data.returned];

            // Common Font Settings
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#64748b';

            // Pie Chart
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if (myPieChart) myPieChart.destroy();
            
            myPieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: chartValues,
                        backgroundColor: chartColors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
                    }
                }
            });

            // Bar Chart
            const barCtx = document.getElementById('barChart').getContext('2d');
            if (myBarChart) myBarChart.destroy();
            
            myBarChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Amount',
                        data: chartValues,
                        backgroundColor: chartColors,
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [4, 4], color: '#e2e8f0' }, border: { display: false } },
                        x: { grid: { display: false }, border: { display: false } }
                    }
                }
            });
        }

        // Run application
        window.onload = init;
    </script>
</body>
</html>
