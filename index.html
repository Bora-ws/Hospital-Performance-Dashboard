<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital KPI Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Base styles */
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Custom input number removing arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Loading overlay */
        #loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 100;
            justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="text-slate-800 pb-12">

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="flex flex-col items-center">
            <i data-lucide="loader-2" class="animate-spin text-blue-600 w-12 h-12 mb-4"></i>
            <p id="lbl-loading" class="text-lg font-semibold text-blue-800">Syncing with Google Sheets...</p>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <i data-lucide="activity" class="text-white h-6 w-6"></i>
                    </div>
                    <h1 id="lbl-dashboardTitle" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700 hidden sm:block">
                        Hospital Performance Dashboard
                    </h1>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button onclick="toggleLang()" class="flex items-center space-x-2 px-3 py-2 rounded-md hover:bg-slate-100 transition-colors border border-slate-200">
                        <i data-lucide="globe" class="w-4 h-4 text-slate-600"></i>
                        <span id="lbl-langSwitch" class="text-sm font-medium text-slate-600">ខ្មែរ</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <!-- Controls Row -->
        <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-8 gap-6">
            
            <!-- Left Side: Tabs & Dates -->
            <div class="flex flex-col md:flex-row gap-4 w-full xl:w-auto">
                <!-- OPD / IPD Tabs -->
                <div class="flex p-1 space-x-1 bg-white rounded-xl shadow-sm border border-slate-200 shrink-0">
                    <button id="tab-OPD" onclick="switchTab('OPD')" class="px-6 py-2.5 text-sm font-semibold rounded-lg transition-all bg-blue-600 text-white shadow-sm">
                        OPD
                    </button>
                    <button id="tab-IPD" onclick="switchTab('IPD')" class="px-6 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-50">
                        IPD
                    </button>
                </div>

                <!-- Date Filters -->
                <div class="flex flex-wrap items-center p-1 space-x-2 bg-white rounded-xl shadow-sm border border-slate-200 px-3">
                    <div class="flex items-center space-x-2">
                        <label id="lbl-inDate" class="text-xs font-semibold text-slate-500 uppercase">In</label>
                        <input type="date" id="in-date" class="text-sm p-1.5 border border-slate-200 rounded outline-none focus:border-blue-400">
                    </div>
                    <div class="flex items-center space-x-2">
                        <label id="lbl-outDate" class="text-xs font-semibold text-slate-500 uppercase">Out</label>
                        <input type="date" id="out-date" class="text-sm p-1.5 border border-slate-200 rounded outline-none focus:border-blue-400">
                    </div>
                    <button onclick="filterByDate()" class="flex items-center justify-center space-x-1 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded transition-colors">
                        <i data-lucide="filter" class="w-4 h-4"></i>
                        <span id="lbl-filter" class="text-sm font-medium">Filter</span>
                    </button>
                </div>
            </div>

            <!-- Right Side: Edit / Save Actions -->
            <div class="flex items-center space-x-3 w-full xl:w-auto">
                <!-- Edit Mode Actions (Hidden by default) -->
                <div id="edit-actions" class="hidden flex items-center space-x-2 w-full">
                    <div class="hidden sm:flex items-center text-amber-600 text-sm font-medium mr-2 animate-pulse shrink-0">
                        <i data-lucide="alert-circle" class="w-4 h-4 mr-1"></i>
                        <span id="lbl-editMode">Edit mode active</span>
                    </div>
                    <button onclick="cancelEdit()" class="flex-1 xl:flex-none flex items-center justify-center space-x-2 px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-medium shadow-sm">
                        <i data-lucide="x-circle" class="w-4 h-4"></i>
                        <span id="lbl-cancel">Cancel</span>
                    </button>
                    <button onclick="saveChanges()" class="flex-1 xl:flex-none flex items-center justify-center space-x-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors font-medium shadow-sm">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        <span id="lbl-saveChanges">Save Changes</span>
                    </button>
                </div>
                
                <!-- View Mode Actions -->
                <button id="btn-edit" onclick="startEdit()" class="w-full xl:w-auto flex items-center justify-center space-x-2 px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-medium shadow-sm">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                    <span id="lbl-editData">Edit Data</span>
                </button>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                <i data-lucide="activity" class="mr-2 text-blue-500 w-5 h-5"></i>
                <span id="lbl-kpiMetrics">Key Performance Indicators</span>
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 sm:gap-6">
                
                <!-- TOTAL CARD (Contains Verify and Unverify) -->
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 shadow-lg text-white xl:col-span-2 relative overflow-hidden group">
                    <div class="absolute -right-12 -top-12 w-40 h-40 bg-white opacity-5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 bg-white/10 rounded-xl backdrop-blur-sm">
                            <i data-lucide="users" class="text-white h-6 w-6"></i>
                        </div>
                        <div class="bg-white/20 px-3 py-1 rounded-full backdrop-blur-md border border-white/10">
                           <span class="text-sm font-semibold text-white">100%</span>
                        </div>
                    </div>
                    <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                        <div>
                            <h3 id="lbl-total" class="text-slate-300 text-sm font-medium mb-1">Total</h3>
                            <div id="val-total" class="text-4xl font-extrabold tracking-tight">0</div>
                        </div>
                        <div class="flex space-x-4 bg-white/10 p-3 rounded-xl border border-white/10 w-full sm:w-auto">
                            <!-- Verify Case -->
                            <div>
                                <div id="lbl-verifyCase" class="text-xs text-emerald-300 font-medium mb-1 uppercase tracking-wider">Verify Case</div>
                                <div id="val-verifyCase" class="text-xl font-bold view-element">0</div>
                                <input type="number" id="input-verifyCase" oninput="handleInput('verifyCase')" class="hidden w-full sm:w-24 text-lg font-bold text-slate-900 bg-white border-2 border-emerald-400 rounded p-1 focus:outline-none edit-element" />
                            </div>
                            <div class="w-px bg-white/20"></div>
                            <!-- Unverify Case -->
                            <div>
                                <div id="lbl-unverifyCase" class="text-xs text-rose-300 font-medium mb-1 uppercase tracking-wider">Unverify Case</div>
                                <div id="val-unverifyCase" class="text-xl font-bold view-element">0</div>
                                <input type="number" id="input-unverifyCase" oninput="handleInput('unverifyCase')" class="hidden w-full sm:w-24 text-lg font-bold text-slate-900 bg-white border-2 border-rose-400 rounded p-1 focus:outline-none edit-element" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Metric Card Template Function logic will populate these -->
                <!-- Rejected -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-red-100"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 rounded-xl bg-red-100 text-red-600"><i data-lucide="x-circle" class="w-6 h-6"></i></div>
                        <div class="flex items-center bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100"><span id="pct-rejected" class="text-sm font-semibold text-slate-600">0%</span></div>
                    </div>
                    <div class="relative z-10">
                        <h3 id="lbl-rejected" class="text-slate-500 text-sm font-medium mb-1">Rejected</h3>
                        <div id="val-rejected" class="text-3xl font-bold text-slate-800 view-element">0</div>
                        <input type="number" id="input-rejected" oninput="handleInput('rejected')" class="hidden w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                    </div>
                </div>

                <!-- Approved -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-green-100"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 rounded-xl bg-green-100 text-green-600"><i data-lucide="check-circle" class="w-6 h-6"></i></div>
                        <div class="flex items-center bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100"><span id="pct-approved" class="text-sm font-semibold text-slate-600">0%</span></div>
                    </div>
                    <div class="relative z-10">
                        <h3 id="lbl-approved" class="text-slate-500 text-sm font-medium mb-1">Approved</h3>
                        <div id="val-approved" class="text-3xl font-bold text-slate-800 view-element">0</div>
                        <input type="number" id="input-approved" oninput="handleInput('approved')" class="hidden w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                    </div>
                </div>

                <!-- Hospital Director -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-purple-100"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 rounded-xl bg-purple-100 text-purple-600"><i data-lucide="settings" class="w-6 h-6"></i></div>
                        <div class="flex items-center bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100"><span id="pct-hospitalDirector" class="text-sm font-semibold text-slate-600">0%</span></div>
                    </div>
                    <div class="relative z-10">
                        <h3 id="lbl-hospitalDirector" class="text-slate-500 text-sm font-medium mb-1 truncate">Hospital Director</h3>
                        <div id="val-hospitalDirector" class="text-3xl font-bold text-slate-800 view-element">0</div>
                        <input type="number" id="input-hospitalDirector" oninput="handleInput('hospitalDirector')" class="hidden w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                    </div>
                </div>

                <!-- On Checking -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-yellow-100"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 rounded-xl bg-yellow-100 text-yellow-600"><i data-lucide="clock" class="w-6 h-6"></i></div>
                        <div class="flex items-center bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100"><span id="pct-onChecking" class="text-sm font-semibold text-slate-600">0%</span></div>
                    </div>
                    <div class="relative z-10">
                        <h3 id="lbl-onChecking" class="text-slate-500 text-sm font-medium mb-1">On Checking</h3>
                        <div id="val-onChecking" class="text-3xl font-bold text-slate-800 view-element">0</div>
                        <input type="number" id="input-onChecking" oninput="handleInput('onChecking')" class="hidden w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                    </div>
                </div>

                <!-- Returned -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 bg-slate-200"></div>
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="p-3 rounded-xl bg-slate-200 text-slate-700"><i data-lucide="rotate-ccw" class="w-6 h-6"></i></div>
                        <div class="flex items-center bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100"><span id="pct-returned" class="text-sm font-semibold text-slate-600">0%</span></div>
                    </div>
                    <div class="relative z-10">
                        <h3 id="lbl-returned" class="text-slate-500 text-sm font-medium mb-1">Returned</h3>
                        <div id="val-returned" class="text-3xl font-bold text-slate-800 view-element">0</div>
                        <input type="number" id="input-returned" oninput="handleInput('returned')" class="hidden w-full text-2xl font-bold text-slate-800 bg-white border-2 border-blue-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 edit-element" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Pie Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <i data-lucide="pie-chart" class="mr-2 text-indigo-500 w-5 h-5"></i>
                    <span id="lbl-statusDistribution">Status Distribution</span>
                </h3>
                <div class="relative h-[300px] w-full flex justify-center">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>

            <!-- Bar Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <i data-lucide="trending-up" class="mr-2 text-green-500 w-5 h-5"></i>
                    <span id="lbl-trendAnalysis">Current Distribution (Count)</span>
                </h3>
                <div class="relative h-[300px] w-full">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ⚠️ ---
        const GOOGLE_WEB_APP_URL = "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE";

        // Global State
        let currentLang = 'en';
        let activeTab = 'OPD';
        let isEditing = false;
        let chartInstances = {};
        
        // Data Store
        let hospitalData = {
            OPD: { verifyCase: 4218, unverifyCase: 2300, total: 6518, rejected: 1725, approved: 2803, hospitalDirector: 256, onChecking: 1734, returned: 0 },
            IPD: { verifyCase: 3000, unverifyCase: 1250, total: 4250, rejected: 850, approved: 2100, hospitalDirector: 150, onChecking: 1050, returned: 100 }
        };
        let editData = {}; // Temp store during edits

        // Translations Map
        const translations = {
            en: {
                dashboardTitle: "Hospital Performance Dashboard",
                langSwitch: "ខ្មែរ",
                opd: "OPD", ipd: "IPD",
                inDate: "In", outDate: "Out", filter: "Filter",
                editData: "Edit Data", cancel: "Cancel", saveChanges: "Save Changes", editMode: "Edit mode active",
                kpiMetrics: "Key Performance Indicators",
                total: "Total", verifyCase: "Verify Case", unverifyCase: "Unverify Case",
                rejected: "Rejected", approved: "Approved", hospitalDirector: "Hospital Director", onChecking: "On Checking", returned: "Returned",
                statusDistribution: "Status Distribution", trendAnalysis: "Current Distribution (Count)",
                loading: "Syncing with Google Sheets..."
            },
            km: {
                dashboardTitle: "ផ្ទាំងគ្រប់គ្រងសូចនាករសមិទ្ធកម្មមន្ទីរពេទ្យ",
                langSwitch: "English",
                opd: "OPD", ipd: "IPD",
                inDate: "ថ្ងៃចូល", outDate: "ថ្ងៃចេញ", filter: "ចម្រាញ់",
                editData: "កែសម្រួលទិន្នន័យ", cancel: "បោះបង់", saveChanges: "រក្សាទុកការផ្លាស់ប្តូរ", editMode: "កំពុងកែសម្រួល",
                kpiMetrics: "សូចនាករសមិទ្ធកម្ម",
                total: "សរុប", verifyCase: "បានផ្ទៀងផ្ទាត់", unverifyCase: "មិនទាន់ផ្ទៀងផ្ទាត់",
                rejected: "បដិសេធ", approved: "អនុម័ត", hospitalDirector: "ប្រធានមន្ទីរពេទ្យ", onChecking: "កំពុងពិនិត្យ", returned: "បានបញ្ជូនត្រឡប់",
                statusDistribution: "ការចែកចាយស្ថានភាព", trendAnalysis: "ទិន្នន័យបច្ចុប្បន្ន (ចំនួន)",
                loading: "កំពុងធ្វើសមកាលកម្ម..."
            }
        };

        const chartColors = ['#ef4444', '#22c55e', '#a855f7', '#eab308', '#64748b'];

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'km' : 'en';
            updateUI();
        }

        function switchTab(tab) {
            if (isEditing) {
                // If user clicks tab while editing, cancel edit mode
                cancelEdit();
            }
            activeTab = tab;
            
            // Update button styles
            document.getElementById('tab-OPD').className = tab === 'OPD' 
                ? "px-6 py-2.5 text-sm font-semibold rounded-lg transition-all bg-blue-600 text-white shadow-sm"
                : "px-6 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-50";
            document.getElementById('tab-IPD').className = tab === 'IPD' 
                ? "px-6 py-2.5 text-sm font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm"
                : "px-6 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-50";
            
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            const data = isEditing ? editData : hospitalData[activeTab];

            // 1. Apply Translations
            Object.keys(t).forEach(key => {
                const el = document.getElementById(`lbl-${key}`);
                if (el) el.innerText = t[key];
            });

            // 2. Update KPI Values & Percentages
            const fields = ['verifyCase', 'unverifyCase', 'rejected', 'approved', 'hospitalDirector', 'onChecking', 'returned'];
            
            // Calculate Total if it's somehow missing (Fallback)
            const activeTotal = data.total || (data.verifyCase + data.unverifyCase) || 1;
            document.getElementById('val-total').innerText = activeTotal.toLocaleString();

            fields.forEach(key => {
                const value = data[key] || 0;
                
                // Update text view
                const valEl = document.getElementById(`val-${key}`);
                if (valEl) valEl.innerText = value.toLocaleString();
                
                // Update input view (if active)
                const inputEl = document.getElementById(`input-${key}`);
                if (inputEl) inputEl.value = value;
                
                // Update percentage (Only for the 5 sub-categories, not verify/unverify directly)
                const pctEl = document.getElementById(`pct-${key}`);
                if (pctEl) {
                    const pct = Math.round((value / activeTotal) * 100);
                    pctEl.innerText = `${pct}%`;
                }
            });

            // 3. Render Charts (only if not editing)
            if (!isEditing) {
                renderCharts(data, t);
            }
        }

        function startEdit() {
            isEditing = true;
            // Deep copy current tab data
            editData = JSON.parse(JSON.stringify(hospitalData[activeTab]));
            
            // Toggle visibility classes
            document.getElementById('edit-actions').classList.remove('hidden');
            document.getElementById('btn-edit').classList.add('hidden');
            
            document.querySelectorAll('.view-element').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.edit-element').forEach(el => el.classList.remove('hidden'));
            
            updateUI();
        }

        function cancelEdit() {
            isEditing = false;
            editData = {};
            
            // Toggle visibility classes back
            document.getElementById('edit-actions').classList.add('hidden');
            document.getElementById('btn-edit').classList.remove('hidden');
            
            document.querySelectorAll('.edit-element').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.view-element').forEach(el => el.classList.remove('hidden'));
            
            updateUI();
        }

        function handleInput(field) {
            const el = document.getElementById(`input-${field}`);
            const val = parseInt(el.value) || 0;
            editData[field] = val;
            
            // Auto-calculate Total based on Verify + Unverify
            if (field === 'verifyCase' || field === 'unverifyCase') {
                editData.total = (editData.verifyCase || 0) + (editData.unverifyCase || 0);
                document.getElementById('val-total').innerText = editData.total.toLocaleString();
            }
            
            // Note: We don't call updateUI() here to prevent losing focus on the input box.
        }

        function showLoading(show) {
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        }

        async function saveChanges() {
            if (GOOGLE_WEB_APP_URL === "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE") {
                // Mock Save for Demo purposes
                hospitalData[activeTab] = JSON.parse(JSON.stringify(editData));
                cancelEdit();
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ tab: activeTab, data: editData })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    hospitalData[activeTab] = JSON.parse(JSON.stringify(editData));
                }
            } catch (error) {
                console.error("Save Error:", error);
                // Fallback: save locally even if fetch fails for demo
                hospitalData[activeTab] = JSON.parse(JSON.stringify(editData));
            } finally {
                showLoading(false);
                cancelEdit();
            }
        }

        async function filterByDate() {
            const inDate = document.getElementById('in-date').value;
            const outDate = document.getElementById('out-date').value;
            
            if (GOOGLE_WEB_APP_URL === "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE" || (!inDate && !outDate)) {
                // Demo logic: Just shuffle data slightly to simulate a filter
                hospitalData[activeTab].verifyCase = Math.floor(hospitalData[activeTab].verifyCase * 0.9);
                hospitalData[activeTab].total = hospitalData[activeTab].verifyCase + hospitalData[activeTab].unverifyCase;
                updateUI();
                return;
            }

            showLoading(true);
            try {
                // Construct URL with query parameters
                const fetchUrl = `${GOOGLE_WEB_APP_URL}?inDate=${inDate}&outDate=${outDate}`;
                const response = await fetch(fetchUrl);
                const fetchedData = await response.json();
                
                if (fetchedData && fetchedData.OPD && fetchedData.IPD) {
                    hospitalData = fetchedData;
                }
            } catch (error) {
                console.error("Filter Error:", error);
            } finally {
                showLoading(false);
                updateUI();
            }
        }

        function renderCharts(data, t) {
            const chartLabels = [t.rejected, t.approved, t.hospitalDirector, t.onChecking, t.returned];
            const chartValues = [data.rejected, data.approved, data.hospitalDirector, data.onChecking, data.returned];

            // Destroy existing charts to prevent canvas overlap issues
            if (chartInstances.pie) chartInstances.pie.destroy();
            if (chartInstances.bar) chartInstances.bar.destroy();

            // Setup common chart styling
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#64748b';

            // Render Pie Chart
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            chartInstances.pie = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartValues,
                        backgroundColor: chartColors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
                    }
                }
            });

            // Render Bar Chart
            const ctxBar = document.getElementById('barChart').getContext('2d');
            chartInstances.bar = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: t.trendAnalysis,
                        data: chartValues,
                        backgroundColor: chartColors,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [4, 4], color: '#e2e8f0' }, border: {display: false} },
                        x: { grid: { display: false }, border: {display: false} }
                    }
                }
            });
        }

        // Initialize the application on load
        window.onload = () => {
            lucide.createIcons();
            updateUI();
        };

    </script>
</body>
</html>
